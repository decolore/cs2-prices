name: Fix capped prices

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Allow unprivileged user namespaces for Chromium
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape capped items
        run: python -u scripts/fix_capped.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capped-fix
          path: prices/capped_fix.json
          if-no-files-found: warn

      - name: Commit result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add prices/capped_fix.json || true
          git commit -m 'update capped price fixes' || echo 'nothing to commit'
          git push || echo 'nothing to push'
