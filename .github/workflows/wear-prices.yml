name: Scrape per-wear prices

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max items to scrape (0 = all)'
        required: false
        default: '0'
      workers:
        description: 'Parallel browser workers (rendered mode)'
        required: false
        default: '6'
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  wears:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Prepare Chromium (fallback renderer)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python -m playwright install --with-deps chromium

      - name: Scrape
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: python scripts/scrape_wears.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-prices
          path: prices/*.json
          if-no-files-found: warn

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "wear prices: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
