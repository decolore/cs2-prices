name: Build per-wear prices (feed)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Build price table
        run: python scripts/build_wear_prices.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wear-prices
          path: prices/*.json
          if-no-files-found: error

      - name: Commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices/*.json || true
          git commit -m "wear prices (feed): $(date -u '+%Y-%m-%d %H:%M UTC')" || echo 'nothing to commit'
          git push || true
