name: Scrape CS2 prices

on:
  push:
    paths:
      - '.github/workflows/scrape.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone scraper source
        run: git clone --depth 1 https://github.com/eovacius/csgodatabase-scraper.git /tmp/scraper

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Make Chrome usable in CI
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser)"
          fi
          echo "real chrome binary: $CHROME"
          "$CHROME" --version || true
          sudo tee /usr/local/bin/headless_shell >/dev/null <<EOF
          #!/bin/sh
          exec "$CHROME" --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-setuid-sandbox "\$@"
          EOF
          sudo chmod +x /usr/local/bin/headless_shell
          echo "wrapper:"
          cat /usr/local/bin/headless_shell
          headless_shell --version

      - name: Run scraper
        working-directory: /tmp/scraper
        run: |
          mkdir -p json
          rm -f json/*.json
          go run . --aggressive
          echo "--- output ---"
          ls -la json

      - name: Copy result into prices/
        run: |
          mkdir -p prices
          cp /tmp/scraper/json/data_*.json prices/
          ls -la prices

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2-prices-json
          path: prices/*.json
          if-no-files-found: error

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "prices: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
